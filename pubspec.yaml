name: shamba_smart
description: "Shamba Smart — Agentic offline-first agricultural IoT companion by Farmers Hope."
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # -- State management --
  flutter_riverpod: ^2.5.1

  # -- Local database & offline-first sync --
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  supabase_flutter: ^2.5.6

  # supabase_flutter pulls in app_links transitively (for auth redirect
  # links) but doesn't force a recent-enough version. Old app_links
  # releases ship Android build files written for a pre-AGP8 Gradle
  # template ("Could not get unknown property 'flutter'" when building) —
  # pinning it here directly forces pub to resolve a version whose
  # Android side matches the modern template `flutter create` generates.
  app_links: ^7.0.0

  # -- Connectivity & hardware --
  connectivity_plus: ^6.0.3
  flutter_blue_plus: ^1.32.12
  mqtt_client: ^10.3.1

  # -- Security & utilities --
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  intl: ^0.19.0

  # -- AI & diagnostics --
  google_generative_ai: ^0.4.6
  image_picker: ^1.1.2

  # -- UI support --
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
