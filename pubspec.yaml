name: shamba_smart
description: "Shamba Smart — Agentic offline-first agricultural IoT companion by Farmers Hope."
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # -- State management --
  flutter_riverpod: ^2.5.1

  # -- Local database & offline-first sync --
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  supabase_flutter: ^2.5.6

  # Pin this package because newer releases require a newer Dart SDK,
  # while older releases contain incompatible legacy Android Gradle files.
  app_links: 6.2.1

  # -- Connectivity & hardware --
  connectivity_plus: ^6.0.3

  # Pin exactly. flutter_blue_plus 2.2.1 resolves to
  # flutter_blue_plus_android 8.2.1. That Android package contains
  # legacy Gradle references to:
  #   - flutter.compileSdkVersion
  #   - gradle.projectsEvaluated
  #
  # The build workflow patches those legacy references after pub get
  # and before Gradle runs, making this version usable with Flutter 3.24.0.
  flutter_blue_plus: 2.2.1

  mqtt_client: ^10.3.1

  # -- Security & utilities --
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  intl: ^0.19.0

  # -- AI & diagnostics --
  google_generative_ai: ^0.4.6
  image_picker: ^1.1.2

  # -- UI support --
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
