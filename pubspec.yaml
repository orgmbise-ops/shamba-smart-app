name: shamba_smart
description: "Shamba Smart — Agentic offline-first agricultural IoT companion by Farmers Hope."
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # -- State management --
  flutter_riverpod: ^2.5.1

  # -- Local database & offline-first sync --
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  supabase_flutter: ^2.5.6

  # supabase_flutter pulls in app_links transitively (for auth redirect
  # links) but doesn't force a recent-enough version. Old app_links
  # releases ship Android build files written for a pre-AGP8 Gradle
  # template ("Could not get unknown property 'flutter'" when building).
  # Pinned to an EXACT version, not a caret range: 6.2.1 is specifically
  # where app_links added AGP8/compileSdk34 support (fixing the Gradle
  # error) while still supporting our pinned older Flutter/Dart SDK —
  # 7.0.0+ needs Dart >=3.10, which is too new for isar's analyzer, and
  # 6.4.1 (the next patch after 6.2.1) regressed something in its own
  # Gradle settings that brought the same error back. Don't use ^ here.
  app_links: 6.2.1

  # -- Connectivity & hardware --
  connectivity_plus: ^6.0.3
  # 2.3.17 includes the Android Gradle/Flutter 3.22+ compatibility fix.
  # 2.3.12 resolves flutter_blue_plus_android 9.0.3, which fails during
  # generated Flutter 3.24 release builds with a null substring() call and
  # a missing compileSdkVersion.
  flutter_blue_plus: ^2.3.17
  mqtt_client: ^10.3.1

  # -- Security & utilities --
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  intl: ^0.19.0

  # -- AI & diagnostics --
  google_generative_ai: ^0.4.6
  image_picker: ^1.1.2

  # -- UI support --
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
