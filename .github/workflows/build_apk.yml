name: Build Android APK

# Run this manually from the "Actions" tab in GitHub, or it runs
# automatically every time you push to the main branch.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java (required by the Android build tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This project ships as Dart source only (lib/, pubspec.yaml).
      # `flutter create .` fills in the missing android/ folder (and
      # ios/web/etc, which we don't need for an APK) around the
      # existing code. IMPORTANT: `flutter create --overwrite` can also
      # overwrite pubspec.yaml with Flutter's bare default template —
      # so we back it up first and restore our real one right after.
      #
      # We also force a clean slate on android/ (delete then regenerate)
      # so a stale or manually-edited Gradle file committed in a previous
      # debugging attempt can never linger and conflict with the freshly
      # generated one. This step should always be the ONLY source of
      # truth for android/ — never hand-edit or commit files under it.
      - name: Scaffold Android platform files (clean)
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          rm -rf android
          flutter create . --platforms=android --org com.farmershope --project-name shamba_smart --overwrite
          mv pubspec.yaml.bak pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar code (models/*.g.dart)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        # These come from your repo's Settings → Secrets and variables →
        # Actions (see README). MQTT_* are optional — leave them unset in
        # GitHub if you don't have a broker yet; the app just won't attempt
        # a cloud/web connection to the ESP32 until you add them later.
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=MQTT_BROKER=${{ secrets.MQTT_BROKER }} \
            --dart-define=MQTT_USERNAME=${{ secrets.MQTT_USERNAME }} \
            --dart-define=MQTT_PASSWORD=${{ secrets.MQTT_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shamba-smart-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
