        - name: Install dependencies
        run: flutter pub get

      - name: Patch legacy Bluetooth Android Gradle script
        shell: bash
        run: |
          set -euo pipefail

          cache_root="${PUB_CACHE:-$HOME/.pub-cache}"
          package_dir="$(find "$cache_root/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name 'flutter_blue_plus_android-*' \
            2>/dev/null \
            | sort -V \
            | tail -n 1 || true)"

          if [ -z "${package_dir:-}" ]; then
            echo "Could not find flutter_blue_plus_android in $cache_root/hosted/pub.dev"
            echo "Checked candidates:"
            find "$cache_root" -maxdepth 4 -type d -name 'flutter_blue_plus_android-*' 2>/dev/null || true
            exit 1
          fi

          gradle="$package_dir/android/build.gradle"
          if [ ! -f "$gradle" ]; then
            echo "Missing Gradle file: $gradle"
            exit 1
          fi

          python3 - "$gradle" <<'PY'
          import pathlib
          import sys

          gradle = pathlib.Path(sys.argv[1])
          text = gradle.read_text()

          # Fix deprecated Flutter property reference
          text = text.replace("flutter.compileSdkVersion", "34")

          # Remove legacy gradle.projectsEvaluated block safely
          marker = "gradle.projectsEvaluated"
          start = text.find(marker)
          if start != -1:
              brace_start = text.find("{", start)
              if brace_start == -1:
                  raise SystemExit("Found gradle.projectsEvaluated without opening brace")

              depth = 0
              end = None
              for index in range(brace_start, len(text)):
                  ch = text[index]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break

              if end is None:
                  raise SystemExit("Unbalanced gradle.projectsEvaluated closure")

              text = text[:start].rstrip() + "\n" + text[end:].lstrip()

          if text.count("{") != text.count("}"):
              raise SystemExit("Patched Gradle file has unbalanced braces")

          gradle.write_text(text)
          print(f"Patched {gradle}")
          PY

          echo "--- Patched file preview ---"
          sed -n '1,180p' "$package_dir/android/build.gradle"
